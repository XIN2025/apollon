[project]
name = "loanfile"
version = "0.1.0"
description = "Builds a commercial real-estate loan file from borrower documents and surfaces only the differences that change the credit decision."
requires-python = ">=3.12"
dependencies = [
    "openai>=3.26.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "rapidocr-onnxruntime>=1.4.4",
    "reportlab>=5.0.1",
    "scipy>=1.18.1",
    "tenacity>=9.1.4",
    "typer>=0.27.3",
]
