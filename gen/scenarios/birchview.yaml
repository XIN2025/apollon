reviewer_script: []

planted:
  - id: T1
    match: {bridge: residual_located, located: gross_rents}
    kind: bridge
    what: FY2025 NOI 328,600 vs 8825 line 19 42,500; interest, depreciation and amortization bridge it to 338,200, leaving -9,600.
    expect: {status: partially_explained, bridge: [interest, depreciation, amortization], bridged_value: 338200, residual: -9600, residual_located_in: T2}
  - id: T2
    match: {card: 'conflict:gross_rents:2025', axes: [integrity], hypothesis: true}
    kind: real_conflict
    what: Gross rents 512,400 (cash-basis statement) vs 8825 line 2a 522,000. No catalog bridge applies (cash vs accrual is not in the catalog).
    expect: {status: conflict, axes: [integrity], decision_impact: none, investigator: hypothesis_unverified}
  - id: T3
    match: {beneficial_owner: ruiz}
    kind: rule_boundary
    what: Ana Ruiz owns exactly 25%, which counts as a beneficial owner (25 percent or more).
    expect: {status: beneficial_owner}
  - id: T4
    match: {card: 'entity:unmatched:pfs_ruiz', not_merged: [pfs_ruiz, certification]}
    kind: trap_entity
    what: PFS for "Ana Ruíz" (SSN ...2290, born 1962) is not member Ana Ruiz (SSN ...7745, born 1990).
    expect: {status: no_merge, finding: document_for_unidentified_party}
  - id: T5
    match: {cards: ['missing:pfs:person:anaruiz-7745', 'missing:appraisal'], rule: [ltv, unresolved]}
    kind: missing
    what: No PFS for Ana Ruiz (>=25% owner) once T4 is handled; no appraisal at all, so LTV cannot be computed.
    expect: {status: missing, items: [pfs_ruiz, appraisal], rule_ltv: unresolved}
  - id: T6
    match: {card: 'integrity:rent_roll:total monthly rent', axes: [integrity]}
    kind: real_conflict
    what: Rent roll states total monthly rent 43,300 but its unit rows sum to 42,100.
    expect: {status: conflict, axes: [integrity], decision_impact: none}
  - id: T7
    match: {comparison: [gross_rents, not_comparable, different_period]}
    kind: trap_period
    what: The trailing twelve months (Jun 2025 - May 2026) vs FY2025 and vs the TY2025 return.
    expect: {status: not_comparable, reason: different_period}
  - id: T8
    match: {scaled: t12}
    kind: noise_units
    what: The trailing-twelve-month statement is in $000s (531.6 = 531,600).
    expect: {status: scaled, transform: thousands}
  - id: T9
    match: {merged: [org, [loan_request, form_8825, form_4562, certification, operating_agreement]]}
    kind: noise_entity_names
    what: '"Northgate Birchview LLC", "Northgate-Birchview, LLC" and "NORTHGATE BIRCHVIEW L.L.C." are one borrower (EIN 07-6630918).'
    expect: {status: merged, basis: ein}
  - id: T10
    match: {merged: [collateral, [loan_request, form_8825]]}
    kind: noise_collateral
    what: '"2200 Birchview Ter." vs "2200 Birchview Terrace".'
    expect: {status: merged, basis: address}
  - id: T11
    match: {comparison: [other_opex, equal_after_mapping]}
    kind: noise_mapping
    what: Property management 21,200 + turnover 9,800 + amortization 3,000 (4562 line 44) = 8825 line 17 34,000.
    expect: {status: equal_after_mapping}
  - id: T12
    match: {comparison: [loan_amount, equal_after_transform]}
    kind: noise_units
    what: '"$3.15MM" in the narrative vs "$3,150,000" in the table; "300 months" amortization = 25 years.'
    expect: {status: equal_after_transform}
